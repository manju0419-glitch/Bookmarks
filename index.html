<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
            --warning: #f59e0b;
            --success: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        h1 { margin: 0; }
        .subtitle { color: var(--muted); margin-top: 6px; }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: var(--primary-dark); }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 6px;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            min-width: 260px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
        }
        th, td {
            text-align: left;
            padding: 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        th { background: #eff6ff; }
        tr:hover { background: #f8fbff; }
        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            margin-right: 6px;
            margin-bottom: 4px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .link-btn, .danger-btn, .favorite-btn {
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }
        .link-btn { background: #e2e8f0; color: var(--text); }
        .danger-btn { background: #fee2e2; color: var(--danger); }
        .favorite-btn { background: #fef3c7; color: #92400e; }
        .messages { margin-bottom: 16px; }
        .message {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px;
            background: var(--card);
            border-radius: 16px;
            border: 1px dashed var(--border);
        }
        a.website {
            color: var(--primary-dark);
            word-break: break-all;
        }
        @media (max-width: 800px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr {
                margin-bottom: 16px;
                background: var(--card);
                border-radius: 16px;
                border: 1px solid var(--border);
                overflow: hidden;
            }
            td {
                border-bottom: 1px solid var(--border);
            }
            td::before {
                content: attr(data-label);
                display: block;
                font-weight: bold;
                margin-bottom: 4px;
                color: var(--muted);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>Bookmark Manager</h1>
            <div class="subtitle">Manage your favorite websites with Java and Spring Boot</div>
        </div>
        <a class="btn" th:href="@{/bookmarks/new}">+ Add Bookmark</a>
    </div>

    <div class="messages">
        <div th:if="${successMessage}" class="message success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></div>
    </div>

    <div class="stats">
        <div class="card">
            <div>Total Bookmarks</div>
            <div class="stat-number" th:text="${totalCount}">0</div>
        </div>
        <div class="card">
            <div>Favorites</div>
            <div class="stat-number" th:text="${favoriteCount}">0</div>
        </div>
    </div>

    <form class="search-bar" th:action="@{/bookmarks}" method="get">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by title, URL, category, or tags">
        <button class="btn" type="submit">Search</button>
    </form>

    <div th:if="${#lists.isEmpty(bookmarks)}" class="empty">
        No bookmarks found. Add your first website bookmark.
    </div>

    <table th:if="${!#lists.isEmpty(bookmarks)}">
        <thead>
        <tr>
            <th>Title</th>
            <th>Website</th>
            <th>Category / Tags</th>
            <th>Notes</th>
            <th>Favorite</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="bookmark : ${bookmarks}">
            <td data-label="Title">
                <strong th:text="${bookmark.title}">Title</strong>
            </td>
            <td data-label="Website">
                <a class="website" th:href="${bookmark.url}" th:text="${bookmark.url}" target="_blank"></a>
            </td>
            <td data-label="Category / Tags">
                <div><span class="badge" th:text="${bookmark.category ?: 'General'}"></span></div>
                <div th:if="${bookmark.tags != null and !bookmark.tags.isBlank()}" th:text="${bookmark.tags}"></div>
            </td>
            <td data-label="Notes" th:text="${bookmark.notes}">Notes</td>
            <td data-label="Favorite">
                <span th:text="${bookmark.favorite ? '★ Yes' : '☆ No'}"></span>
            </td>
            <td data-label="Actions">
                <div class="actions">
                    <a class="link-btn" th:href="@{'/bookmarks/edit/' + ${bookmark.id}}">Edit</a>
                    <form th:action="@{'/bookmarks/favorite/' + ${bookmark.id}}" method="post">
                        <button type="submit" class="favorite-btn" th:text="${bookmark.favorite ? 'Unfavorite' : 'Favorite'}"></button>
                    </form>
                    <a class="danger-btn" th:href="@{'/bookmarks/delete/' + ${bookmark.id}}" onclick="return confirm('Delete this bookmark?')">Delete</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
